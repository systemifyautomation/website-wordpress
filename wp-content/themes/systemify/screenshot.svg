  <rect x="636" y="622" width="44" height="44" rx="10" fill="rgba(10,102,255,0.08)"/>
  <text x="658" y="650" font-family="Arial" font-size="20" text-anchor="middle">🤖</text>
  <text x="636" y="690" font-family="Arial" font-size="15" font-weight="700" fill="#1A1D2E">AI Workflow Builder</text>
  <text x="636" y="710" font-family="Arial" font-size="12" fill="#6B7280">Custom Make.com / n8n</text>
  <text x="636" y="726" font-family="Arial" font-size="12" fill="#6B7280">powered by GPT-4.</text>
  <rect x="910" y="600" width="260" height="140" rx="16" fill="white" stroke="#DDE3EE" stroke-width="1"/>
  <rect x="926" y="622" width="44" height="44" rx="10" fill="rgba(10,102,255,0.08)"/>
  <text x="948" y="650" font-family="Arial" font-size="20" text-anchor="middle">📊</text>
  <text x="926" y="690" font-family="Arial" font-size="15" font-weight="700" fill="#1A1D2E">Reporting &amp; Analytics</text>
  <text x="926" y="710" font-family="Arial" font-size="12" fill="#6B7280">Auto-generated weekly</text>
